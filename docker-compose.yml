# Attendly — local infrastructure + production-style app container.
#   Dev:   docker compose up -d db redis        (then `npm run dev`)
#   Full:  docker compose --profile app up -d --build
#   S3:    docker compose --profile s3 up -d minio   (set STORAGE_DRIVER=s3)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attendly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendly_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-attendly}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-attendly}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-attendly_minio_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-attendly}:${POSTGRES_PASSWORD:-attendly_dev_password}@db:5432/${POSTGRES_DB:-attendly}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/storage
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  uploads:
